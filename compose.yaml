services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "10000"
      REQUIRE_DATABASE: "true"
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
